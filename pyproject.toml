[tool.poetry]
name = "data-store"
version = "0.1.0"
description = "Historical (t-1) market data store for tiny-trader, sourced via tt-connect"
authors = ["Apurv Salunke <salunke.apurv7@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
Django = "^6.0"
djangorestframework = "^3.17"
python-dotenv = "^1.0"
pandas = "^3.0.3"
pyarrow = "^24.0.0"
duckdb = "^1.5.4"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9"
pytest = "^8.3"
pytest-django = "^4.9"
pytest-cov = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-q"
